<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f4f4">
    <title>Traducteur LSM</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="translator">
      <h1>Traducteur LSM</h1>
      <div class="camera-frame">
        <video id="camera" autoplay muted playsinline aria-label="Aperçu caméra"></video>
        <span id="countdown" class="countdown" aria-live="assertive" hidden></span>
      </div>
      <button id="capture-button" type="button">Capturer</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <output id="result" class="result" aria-label="Résultat et confiance" aria-live="polite" hidden></output>
      <audio id="audio-result" class="audio-result" controls aria-label="Prononciation du résultat" hidden></audio>
    </main>
  </body>
</html>
